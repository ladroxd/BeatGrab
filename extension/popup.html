<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BeatGrab</title>
<style>
  :root {
    --bg: #ffffff; --fg: #18181b; --muted: #6b7280; --line: #e5e7eb; --chip: #f3f4f6;
    --accent: #f57c00; --accent-fg: #ffffff; --ok: #16a34a; --err: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1f; --fg: #f4f4f5; --muted: #a1a1aa; --line: #34343a; --chip: #2a2a2f; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 320px; padding: 14px;
    background: var(--bg); color: var(--fg);
    font: 13px/1.4 "Segoe UI", Roboto, Arial, sans-serif;
  }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  header img { width: 24px; height: 24px; }
  header h1 { font-size: 15px; margin: 0; flex: 1; }
  #helper { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #dot.on { background: var(--ok); }
  #dot.off { background: var(--err); }

  #beat { display: flex; gap: 10px; margin-bottom: 10px; }
  #thumb { width: 96px; height: 54px; border-radius: 6px; object-fit: cover; background: var(--chip); flex: none; }
  #thumb[hidden] { display: none; }
  #beat-text { min-width: 0; flex: 1; }
  #video {
    margin: 0; font-weight: 600;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    overflow-wrap: anywhere;
  }
  #uploader { margin: 2px 0 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 12px; }
  #details[hidden] { display: none; }
  #details div { background: var(--chip); border-radius: 8px; padding: 6px 8px; min-width: 0; }
  #details dt { font-size: 11px; color: var(--muted); }
  #details dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #row { display: flex; gap: 8px; align-items: center; }
  #format { display: flex; flex: none; border: 1px solid var(--line); border-radius: 19px; padding: 2px; height: 38px; }
  #format label { position: relative; display: flex; }
  #format input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  #format span { display: flex; align-items: center; padding: 0 10px; border-radius: 16px; font-size: 12px; font-weight: 600; color: var(--muted); }
  #format input:checked + span { background: var(--fg); color: var(--bg); }
  #format input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
  #send {
    flex: 1; height: 38px; border: 0; border-radius: 19px;
    background: var(--accent); color: var(--accent-fg);
    font: 600 14px "Segoe UI", Roboto, Arial, sans-serif; cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
  #send:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  #result { min-height: 18px; margin: 10px 0 0; overflow-wrap: anywhere; }
  #result.ok { color: var(--ok); }
  #result.err { color: var(--err); }
  footer {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--muted); overflow-wrap: anywhere;
    display: flex; gap: 8px; align-items: flex-start;
  }
  #folder { flex: 1; min-width: 0; }
  #change {
    flex: none; border: 1px solid var(--line); border-radius: 12px; background: none;
    color: var(--fg); font: 600 12px "Segoe UI", Roboto, Arial, sans-serif; padding: 3px 10px; cursor: pointer;
  }
  #change[hidden] { display: none; }
  #change:disabled { opacity: 0.5; cursor: default; }
  #change:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
</style>
</head>
<body>
  <header>
    <img src="icon128.png" alt="">
    <h1>BeatGrab</h1>
    <div id="helper"><span id="dot"></span><span id="helper-text">Checking...</span></div>
  </header>

  <div id="beat">
    <img id="thumb" alt="" hidden>
    <div id="beat-text">
      <p id="video"></p>
      <p id="uploader"></p>
    </div>
  </div>

  <dl id="details" hidden>
    <div><dt>BPM</dt><dd id="bpm">...</dd></div>
    <div><dt>Key</dt><dd id="key">...</dd></div>
    <div><dt>Length</dt><dd id="length">...</dd></div>
  </dl>

  <div id="row">
    <div id="format" role="radiogroup" aria-label="File format">
      <label><input type="radio" name="format" value="mp3" checked><span>MP3</span></label>
      <label><input type="radio" name="format" value="wav"><span>WAV</span></label>
    </div>
    <button id="send" type="button" disabled>Send to FL</button>
  </div>
  <p id="result" role="status"></p>
  <footer>
    <span id="folder"></span>
    <button id="change" type="button" hidden>Change folder</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
